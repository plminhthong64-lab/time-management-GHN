<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Click-through deck</title>
  <link rel="stylesheet" href="player.css">
  <script src="scorm-1.2-api.js"></script>
</head>
<body>
  <div class="craft-stage">
    <div class="craft-frame" id="craft-frame"><img id="craft-image" alt=""></div>
    <div class="craft-caption" id="craft-caption"></div>
    <div class="craft-controls">
      <button id="craft-prev" type="button" aria-label="Previous">← Back</button>
      <div class="craft-progress"><span id="craft-progress-bar"></span></div>
      <div class="craft-counter" id="craft-counter">0 / 0</div>
      <button id="craft-next" type="button" aria-label="Next">Next →</button>
    </div>
  </div>
  <script src="player.js"></script>
</body>
</html>
